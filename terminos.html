<!DOCTYPE html>
<html lang="es" data-title-key="terms.title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Términos y Condiciones | ATMOS Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: {
            colors: { atmosBg: '#1C1C1E', atmosCard: '#2a2a2c', atmosText: '#FFFFFF', atmosAccent: '#408179', atmosShadow: '#326760' },
            fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
        } } }
    </script>
</head>
<body class="bg-atmosBg text-white font-sans antialiased flex flex-col min-h-screen">

    <nav class="fixed w-full z-50 bg-atmosBg/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 bg-atmosCard rounded-lg border border-white/10 overflow-hidden">
                    <img src="logo.png" alt="ATMOS Studio" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col">
                    <span class="font-bold tracking-[0.2em] text-sm text-white">ATMOS</span>
                    <span class="text-[10px] text-atmosAccent uppercase tracking-widest font-medium">Studio</span>
                </div>
            </a>
            <div class="flex items-center gap-6">
                <select id="lang-select" data-i18n-aria="lang"
                        class="bg-transparent text-sm text-gray-300 border border-white/10 rounded-lg px-2 py-1.5 focus:outline-none focus:border-atmosAccent cursor-pointer"></select>
                <a href="index.html" data-i18n="page.back" class="hidden sm:block text-sm font-medium text-gray-400 hover:text-white transition-colors"></a>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-20 px-6">
        <div class="max-w-3xl mx-auto">
            <h1 data-i18n="terms.0" class="text-3xl md:text-4xl font-bold mb-3"></h1>
            <p data-i18n="terms.1" class="text-sm text-gray-500 mb-6"></p>
            <p data-i18n="terms.2"
               class="mb-10 border-s-2 border-atmosAccent bg-atmosCard/60 px-4 py-3 text-xs text-gray-400 leading-relaxed"></p>
            <div class="space-y-6">
                <h2 data-i18n="terms.3" class="text-lg font-bold text-white pt-2"></h2>
                <p data-i18n="terms.4" class="text-gray-400 text-sm leading-relaxed"></p>
                <h2 data-i18n="terms.5" class="text-lg font-bold text-white pt-2"></h2>
                <p data-i18n="terms.6" class="text-gray-400 text-sm leading-relaxed"></p>
                <h2 data-i18n="terms.7" class="text-lg font-bold text-white pt-2"></h2>
                <p data-i18n="terms.8" class="text-gray-400 text-sm leading-relaxed"></p>
                <p data-i18n="terms.9" class="text-gray-400 text-sm leading-relaxed"></p>
                <p data-i18n="terms.10" class="text-gray-400 text-sm leading-relaxed"></p>
                <h2 data-i18n="terms.11" class="text-lg font-bold text-white pt-2"></h2>
                <p data-i18n="terms.12" class="text-gray-400 text-sm leading-relaxed"></p>
                <p data-i18n="terms.13" class="text-gray-400 text-sm leading-relaxed"></p>
                <p data-i18n="terms.14" class="text-gray-400 text-sm leading-relaxed"></p>
                <p data-i18n="terms.15" class="text-gray-400 text-sm leading-relaxed"></p>
                <p data-i18n="terms.16" class="text-gray-400 text-sm leading-relaxed"></p>
                <h2 data-i18n="terms.17" class="text-lg font-bold text-white pt-2"></h2>
                <p data-i18n="terms.18" class="text-gray-400 text-sm leading-relaxed"></p>
                <p data-i18n="terms.19" class="text-gray-400 text-sm leading-relaxed"></p>
                <h2 data-i18n="terms.20" class="text-lg font-bold text-white pt-2"></h2>
                <p data-i18n="terms.21" class="text-gray-400 text-sm leading-relaxed"></p>
                <h2 data-i18n="terms.22" class="text-lg font-bold text-white pt-2"></h2>
                <p data-i18n="terms.23" class="text-gray-400 text-sm leading-relaxed"></p>
                <h2 data-i18n="terms.24" class="text-lg font-bold text-white pt-2"></h2>
                <p data-i18n="terms.25" class="text-gray-400 text-sm leading-relaxed"></p>
                <h2 data-i18n="terms.26" class="text-lg font-bold text-white pt-2"></h2>
                <p data-i18n="terms.27" class="text-gray-400 text-sm leading-relaxed"></p>
            </div>
        </div>
    </main>

    <footer class="py-12 border-t border-white/5 text-center bg-atmosCard/30">
        <div class="flex justify-center gap-6 text-sm text-gray-500 flex-wrap px-4">
            <a href="terminos.html" data-i18n="footer.terms" class="hover:text-atmosAccent transition-colors"></a>
            <a href="privacidad.html" data-i18n="footer.privacy" class="hover:text-atmosAccent transition-colors"></a>
            <a href="faq.html" data-i18n="footer.faq" class="hover:text-atmosAccent transition-colors"></a>
            <a href="mailto:soporte@app-atmos.com" data-i18n="footer.support" class="hover:text-atmosAccent transition-colors"></a>
        </div>
    </footer>

    <script src="i18n.js"></script>
    <script>
        (function () {
            const selector = document.getElementById("lang-select");
            window.AtmosI18n.LANGS.forEach((l) => {
                const o = document.createElement("option");
                o.value = l.code; o.textContent = `${l.flag} ${l.name}`;
                selector.appendChild(o);
            });
            selector.addEventListener("change", (e) => window.AtmosI18n.aplicarIdioma(e.target.value));
            window.AtmosI18n.aplicarIdioma(window.AtmosI18n.idiomaInicial());
        })();
    </script>
</body>
</html>
