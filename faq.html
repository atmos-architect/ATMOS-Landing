        details > summary { list-style: none; }

        @keyframes sweep { 0% {opacity: 0; margin-top: -10px} 100% {opacity: 1; margin-top: 10px} }

    <script src="i18n.js"></script>
    <script>
        (function () {
            const selector = document.getElementById("lang-select");
            window.AtmosI18n.LANGS.forEach((l) => {
                const o = document.createElement("option");
                o.value = l.code; o.textContent = `${l.flag} ${l.name}`;
                selector.appendChild(o);
            });
            selector.addEventListener("change", (e) => window.AtmosI18n.aplicarIdioma(e.target.value));
            window.AtmosI18n.aplicarIdioma(window.AtmosI18n.idiomaInicial());
        })();
    </script>
