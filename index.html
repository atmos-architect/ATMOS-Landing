<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATMOS Studio 2.0 | Professional architectural rendering</title>
    <meta name="description" content="Turn sketches, CAD drawings and massing models into photorealistic floor plans, masterplans and 3D perspectives.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

    <!-- El hero es lo primero que se pinta: se precarga para no esperar al JS. -->
    <link rel="preload" as="image" href="assets/hero-showcase.webp" fetchpriority="high">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        atmosBg: '#121417',
                        atmosCard: '#1c1f23',
                        atmosLine: '#2a2f35',
                        atmosText: '#FFFFFF',
                        atmosAccent: '#408179',
                        atmosSoft: '#8b949e',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    boxShadow: {
                        'atmos-glow': '0 0 20px rgba(64, 129, 121, 0.25)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #121417; color: #FFFFFF; }
        /* La marca nunca se invierte, ni con dir="rtl". */
        .marca { direction: ltr; unicode-bidi: isolate; }
        .regla { background: linear-gradient(90deg, transparent, #2a2f35, transparent); height: 1px; }
        /* Hueco de imagen: fondo neutro detrás; si el archivo falta, no rompe. */
        .slot { background: radial-gradient(circle at 50% 40%, #1c1f23, #121417); }
        .slot img { display: block; width: 100%; height: 100%; object-fit: cover; }
        /* El tracking negativo rompe el enlace de las letras árabes. */
        [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3,
        [dir="rtl"] .tracking-tight, [dir="rtl"] [class*="tracking-"] {
            letter-spacing: 0 !important;
        }
    </style>
</head>
<body class="antialiased selection:bg-atmosAccent/30">

    <nav class="fixed w-full z-50 bg-atmosBg/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center gap-4">
            <a href="/" class="flex items-center gap-3 marca">
                <div class="w-10 h-10 bg-atmosCard rounded-lg border border-white/10 overflow-hidden">
                    <img src="logo.png" alt="ATMOS Studio" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col">
                    <span class="font-bold tracking-[0.2em] text-sm">ATMOS</span>
                    <span class="text-[10px] text-atmosAccent uppercase tracking-widest font-medium">Studio</span>
                </div>
            </a>

            <div class="flex items-center gap-4">
                <select id="lang-select" data-i18n-aria="lang"
                        class="bg-transparent text-sm text-gray-300 border border-white/10 rounded-lg px-2 py-1.5 focus:outline-none focus:border-atmosAccent cursor-pointer"></select>
                <a href="https://app.app-atmos.com" data-i18n="cta.web"
                   class="hidden sm:block px-4 py-2 text-sm font-semibold bg-white text-atmosBg rounded-full hover:bg-gray-200 transition-colors"></a>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <section class="relative pt-36 pb-20 px-6 overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[520px] bg-atmosAccent/10 rounded-full blur-[130px] -z-10"></div>

        <div class="max-w-4xl mx-auto text-center">
            <p data-i18n="hero.badge"
               class="inline-block mb-7 px-4 py-1.5 text-[11px] uppercase tracking-[0.18em] text-atmosAccent border border-atmosAccent/30 rounded-full"></p>

            <h1 data-i18n="hero.title"
                class="text-4xl md:text-6xl font-bold mb-7 tracking-tight leading-[1.1]"></h1>

            <p data-i18n="hero.sub"
               class="text-base md:text-xl text-gray-400 mb-10 max-w-3xl mx-auto leading-relaxed"></p>

            <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
                <a href="https://app.app-atmos.com" data-i18n="cta.web"
                   class="w-full md:w-auto px-8 py-4 bg-white text-atmosBg font-bold rounded-xl shadow-atmos-glow hover:scale-[1.03] transition-transform duration-300 text-center"></a>
                <a href="https://apps.apple.com/app/id6757624696" target="_blank" rel="noopener"
                   data-i18n="cta.app"
                   class="w-full md:w-auto px-8 py-4 border border-white/15 text-gray-200 font-medium rounded-xl hover:bg-white/5 hover:text-white transition-all text-center"></a>
            </div>
        </div>

        <div class="mt-16 flex justify-center">
            <div class="slot w-full max-w-5xl aspect-[16/9] rounded-xl overflow-hidden border border-white/10 bg-white/5 shadow-2xl">
                <img src="assets/hero-showcase.webp" alt="ATMOS Studio showcase"
                     width="1920" height="1080" fetchpriority="high"
                     decoding="async" onerror="this.remove()">
            </div>
        </div>
    </section>

    <!-- ESPACIOS DE TRABAJO -->
    <section class="py-24 bg-atmosCard/30 border-y border-white/5 px-6">
        <div class="max-w-6xl mx-auto">
            <p data-i18n="ws.kicker" class="text-[11px] uppercase tracking-[0.25em] text-atmosAccent mb-3"></p>
            <h2 data-i18n="ws.title" class="text-3xl md:text-4xl font-bold mb-14 max-w-2xl"></h2>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <article class="p-5 rounded-2xl bg-atmosBg/70 border border-atmosLine hover:border-atmosAccent/40 transition-colors flex flex-col">
                    <div class="slot aspect-[16/10] rounded-xl overflow-hidden border border-white/10 bg-white/5 mb-6">
                        <img src="assets/workspace-floorplans.webp" alt="" loading="lazy" decoding="async"
                             width="1200" height="891" onerror="this.remove()">
                    </div>
                    <div class="px-2 w-12 h-12 bg-atmosAccent/10 rounded-xl flex items-center justify-center mb-6">
                        <svg class="w-6 h-6 text-atmosAccent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M4 5h16v14H4zM9 5v14M4 12h5"></path></svg>
                    </div>
                    <h3 data-i18n="ws1.t" class="text-xl font-bold mb-2"></h3>
                    <p data-i18n="ws1.d" class="text-atmosSoft text-sm mb-6"></p>
                    <ul class="space-y-3 mt-auto">
                        <li class="flex gap-3 text-sm text-gray-400 leading-relaxed"><span class="text-atmosAccent mt-1">×</span><span data-i18n="ws1.b1"></span></li>
                        <li class="flex gap-3 text-sm text-gray-400 leading-relaxed"><span class="text-atmosAccent mt-1">×</span><span data-i18n="ws1.b2"></span></li>
                        <li class="flex gap-3 text-sm text-gray-400 leading-relaxed"><span class="text-atmosAccent mt-1">×</span><span data-i18n="ws1.b3"></span></li>
                    </ul>
                </article>

                <article class="p-5 rounded-2xl bg-atmosBg/70 border border-atmosLine hover:border-atmosAccent/40 transition-colors flex flex-col">
                    <div class="slot aspect-[16/10] rounded-xl overflow-hidden border border-white/10 bg-white/5 mb-6">
                        <img src="assets/workspace-masterplans.webp" alt="" loading="lazy" decoding="async"
                             width="1200" height="891" onerror="this.remove()">
                    </div>
                    <div class="px-2 w-12 h-12 bg-atmosAccent/10 rounded-xl flex items-center justify-center mb-6">
                        <svg class="w-6 h-6 text-atmosAccent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M3 20h18M6 20V9l6-5 6 5v11M10 20v-5h4v5"></path></svg>
                    </div>
                    <h3 data-i18n="ws2.t" class="text-xl font-bold mb-2"></h3>
                    <p data-i18n="ws2.d" class="text-atmosSoft text-sm mb-6"></p>
                    <ul class="space-y-3 mt-auto">
                        <li class="flex gap-3 text-sm text-gray-400 leading-relaxed"><span class="text-atmosAccent mt-1">×</span><span data-i18n="ws2.b1"></span></li>
                        <li class="flex gap-3 text-sm text-gray-400 leading-relaxed"><span class="text-atmosAccent mt-1">×</span><span data-i18n="ws2.b2"></span></li>
                        <li class="flex gap-3 text-sm text-gray-400 leading-relaxed"><span class="text-atmosAccent mt-1">×</span><span data-i18n="ws2.b3"></span></li>
                    </ul>
                </article>

                <article class="p-5 rounded-2xl bg-atmosBg/70 border border-atmosLine hover:border-atmosAccent/40 transition-colors flex flex-col">
                    <div class="slot aspect-[16/10] rounded-xl overflow-hidden border border-white/10 bg-white/5 mb-6">
                        <img src="assets/workspace-perspectives.webp" alt="" loading="lazy" decoding="async"
                             width="1200" height="891" onerror="this.remove()">
                    </div>
                    <div class="px-2 w-12 h-12 bg-atmosAccent/10 rounded-xl flex items-center justify-center mb-6">
                        <svg class="w-6 h-6 text-atmosAccent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M3 17l6-6 4 4 8-8M21 7v5h-5"></path></svg>
                    </div>
                    <h3 data-i18n="ws3.t" class="text-xl font-bold mb-2"></h3>
                    <p data-i18n="ws3.d" class="text-atmosSoft text-sm mb-6"></p>
                    <ul class="space-y-3 mt-auto">
                        <li class="flex gap-3 text-sm text-gray-400 leading-relaxed"><span class="text-atmosAccent mt-1">×</span><span data-i18n="ws3.b1"></span></li>
                        <li class="flex gap-3 text-sm text-gray-400 leading-relaxed"><span class="text-atmosAccent mt-1">×</span><span data-i18n="ws3.b2"></span></li>
                        <li class="flex gap-3 text-sm text-gray-400 leading-relaxed"><span class="text-atmosAccent mt-1">×</span><span data-i18n="ws3.b3"></span></li>
                    </ul>
                </article>
            </div>
        </div>
    </section>

    <!-- TÉCNICAS -->
    <section class="py-24 px-6">
        <div class="max-w-6xl mx-auto">
            <p data-i18n="tech.kicker" class="text-[11px] uppercase tracking-[0.25em] text-atmosAccent mb-3"></p>
            <h2 data-i18n="tech.title" class="text-3xl md:text-4xl font-bold mb-3"></h2>
            <p data-i18n="tech.sub" class="text-atmosSoft mb-14 max-w-xl"></p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="p-5 rounded-2xl border border-atmosLine bg-atmosCard/40">
                    <div class="slot aspect-square rounded-xl overflow-hidden border border-white/10 bg-white/5 mb-5">
                        <img src="assets/tech-photoreal.webp" alt="" loading="lazy" decoding="async"
                             width="900" height="502" onerror="this.remove()">
                    </div>
                    <h3 data-i18n="t1.t" class="text-lg font-bold mb-3 text-atmosAccent px-2"></h3>
                    <p data-i18n="t1.d" class="text-gray-400 text-sm leading-relaxed"></p>
                </div>
                <div class="p-5 rounded-2xl border border-atmosLine bg-atmosCard/40">
                    <div class="slot aspect-square rounded-xl overflow-hidden border border-white/10 bg-white/5 mb-5">
                        <img src="assets/tech-clay.webp" alt="" loading="lazy" decoding="async"
                             width="900" height="502" onerror="this.remove()">
                    </div>
                    <h3 data-i18n="t2.t" class="text-lg font-bold mb-3 text-atmosAccent px-2"></h3>
                    <p data-i18n="t2.d" class="text-gray-400 text-sm leading-relaxed"></p>
                </div>
                <div class="p-5 rounded-2xl border border-atmosLine bg-atmosCard/40">
                    <div class="slot aspect-square rounded-xl overflow-hidden border border-white/10 bg-white/5 mb-5">
                        <img src="assets/tech-watercolor.webp" alt="" loading="lazy" decoding="async"
                             width="900" height="502" onerror="this.remove()">
                    </div>
                    <h3 data-i18n="t3.t" class="text-lg font-bold mb-3 text-atmosAccent px-2"></h3>
                    <p data-i18n="t3.d" class="text-gray-400 text-sm leading-relaxed"></p>
                </div>
                <div class="p-5 rounded-2xl border border-atmosLine bg-atmosCard/40">
                    <div class="slot aspect-square rounded-xl overflow-hidden border border-white/10 bg-white/5 mb-5">
                        <img src="assets/tech-sketch.webp" alt="" loading="lazy" decoding="async"
                             width="900" height="502" onerror="this.remove()">
                    </div>
                    <h3 data-i18n="t4.t" class="text-lg font-bold mb-3 text-atmosAccent px-2"></h3>
                    <p data-i18n="t4.d" class="text-gray-400 text-sm leading-relaxed"></p>
                </div>
            </div>
        </div>
    </section>

    <!-- ENTREGA -->
    <section class="py-24 bg-atmosCard/30 border-y border-white/5 px-6">
        <div class="max-w-6xl mx-auto">
            <p data-i18n="out.kicker" class="text-[11px] uppercase tracking-[0.25em] text-atmosAccent mb-3"></p>
            <h2 data-i18n="out.title" class="text-3xl md:text-4xl font-bold mb-14"></h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="p-6 rounded-2xl bg-atmosBg/70 border border-atmosLine">
                    <h3 data-i18n="out1.t" class="text-base font-bold mb-2"></h3>
                    <p data-i18n="out1.d" class="text-gray-400 text-sm leading-relaxed"></p>
                </div>
                <div class="p-6 rounded-2xl bg-atmosBg/70 border border-atmosLine">
                    <h3 data-i18n="out2.t" class="text-base font-bold mb-2"></h3>
                    <p data-i18n="out2.d" class="text-gray-400 text-sm leading-relaxed"></p>
                </div>
                <div class="p-6 rounded-2xl bg-atmosBg/70 border border-atmosLine">
                    <h3 data-i18n="out3.t" class="text-base font-bold mb-2"></h3>
                    <p data-i18n="out3.d" class="text-gray-400 text-sm leading-relaxed"></p>
                </div>
            </div>
        </div>
    </section>

    <!-- GALERÍA -->
    <section class="py-24 px-6">
        <div class="max-w-6xl mx-auto">
            <h2 data-i18n="gallery.title" class="text-3xl font-bold mb-10"></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="slot aspect-[4/3] rounded-xl overflow-hidden border border-white/10 bg-white/5"><img src="assets/gallery-1.webp" alt="" loading="lazy" decoding="async" width="1200" height="891" onerror="this.remove()"></div>
                <div class="slot aspect-[4/3] rounded-xl overflow-hidden border border-white/10 bg-white/5"><img src="assets/gallery-2.webp" alt="" loading="lazy" decoding="async" width="1200" height="896" onerror="this.remove()"></div>
                <div class="slot aspect-[4/3] rounded-xl overflow-hidden border border-white/10 bg-white/5"><img src="assets/gallery-3.webp" alt="" loading="lazy" decoding="async" width="1200" height="670" onerror="this.remove()"></div>
                <div class="slot aspect-[4/3] rounded-xl overflow-hidden border border-white/10 bg-white/5"><img src="assets/gallery-4.webp" alt="" loading="lazy" decoding="async" width="1200" height="670" onerror="this.remove()"></div>
            </div>
        </div>
    </section>

    <!-- CIERRE -->
    <section class="pb-28 px-6">
        <div class="max-w-4xl mx-auto text-center">
            <div class="regla mb-16"></div>
            <h2 data-i18n="close.title" class="text-3xl md:text-4xl font-serif italic text-atmosAccent mb-10"></h2>
            <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
                <a href="https://app.app-atmos.com" data-i18n="cta.web"
                   class="w-full md:w-auto px-8 py-4 bg-white text-atmosBg font-bold rounded-xl hover:scale-[1.03] transition-transform duration-300 text-center"></a>
                <a href="https://apps.apple.com/app/id6757624696" target="_blank" rel="noopener"
                   data-i18n="cta.app"
                   class="w-full md:w-auto px-8 py-4 border border-white/15 text-gray-200 font-medium rounded-xl hover:bg-white/5 hover:text-white transition-all text-center"></a>
            </div>
        </div>
    </section>

    <footer class="py-12 border-t border-white/5 text-center bg-atmosCard/30">
        <p data-i18n="footer.rights" class="text-gray-500 text-sm mb-6"></p>
        <div class="flex flex-wrap justify-center gap-6 text-sm text-gray-500">
            <a href="terminos.html" data-i18n="footer.terms" class="hover:text-atmosAccent transition-colors"></a>
            <a href="privacidad.html" data-i18n="footer.privacy" class="hover:text-atmosAccent transition-colors"></a>
            <a href="faq.html" data-i18n="footer.faq" class="hover:text-atmosAccent transition-colors"></a>
            <a href="mailto:soporte@app-atmos.com" data-i18n="footer.support" class="hover:text-atmosAccent transition-colors"></a>
        </div>
    </footer>

    <script src="i18n.js"></script>
    <script>
        (function () {
            const selector = document.getElementById("lang-select");
            window.AtmosI18n.LANGS.forEach((l) => {
                const opcion = document.createElement("option");
                opcion.value = l.code;
                opcion.textContent = `${l.flag} ${l.name}`;
                selector.appendChild(opcion);
            });
            selector.addEventListener("change", (e) => {
                window.AtmosI18n.aplicarIdioma(e.target.value);
            });
            window.AtmosI18n.aplicarIdioma(window.AtmosI18n.idiomaInicial());
        })();
    </script>

</body>
</html>
